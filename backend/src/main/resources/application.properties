
spring.application.name=student-open-source-contribution-tracker

server.port=${PORT:8080}

# GitHub public REST API
github.api.base-url=https://api.github.com

# GitHub GraphQL endpoint
github.graphql.url=https://api.github.com/graphql

# GitHub token: configure GITHUB_TOKEN in your environment
github.api.token=${GITHUB_TOKEN:}

# Gemini API key: configure GEMINI_API_KEY in your environment
gemini.api.key=${GEMINI_API_KEY:}

# Gemini model
gemini.api.model=gemini-flash-lite-latest

# Logging
logging.level.com.tracker.githubtracker=INFO
